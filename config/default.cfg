# Example configuration.
# Paths below assume the project is mounted at /webserv (the Docker dev
# environment). For a native run, change the absolute paths to match your setup.

server
{
    host 0.0.0.0;
    listen 9090,9091;
    server_names localhost;
    root /webserv/www/;
    index index.html;
    allow GET,POST,DELETE;
    autoindex on;
    max_body_size 10M;
    upload on;
    path_upload /webserv/www/UploadingFiles/;
    error_pages 404=/webserv/www/error_pages/404.html;
    cgi_info *.php php /cgi-bin, *.py /usr/bin/python3 /cgi-bin;

    location /UploadingFiles
    {
        root /webserv/www;
    }

    location *.py
    {
        cgi_info *.py /usr/bin/python3 /cgi-bin/;
    }
}
